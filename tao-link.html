<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo link khách mời | Minh Luật & Đỗ Vân"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet"></head><body><main class="section"><p class="eyebrow">CÔNG CỤ DÀNH CHO GIA ĐÌNH</p><h2>Tạo link thiệp cá nhân</h2><div class="personalize"><label for="side">Chọn thiệp</label><select id="side"><option value="nha-trai.html">Thiệp nhà trai</option><option value="nha-gai.html">Thiệp nhà gái</option></select><label for="guest">Tên khách mời</label><input id="guest" placeholder="Ví dụ: Anh Nguyễn Văn A"><button class="copy-btn" id="make">Tạo và sao chép link</button><p class="hint" id="result">Trang này dùng để tạo link riêng. Không hiển thị trong thiệp gửi khách.</p></div><p><a href="index.html">Quay lại trang chọn thiệp</a></p></main><script>document.getElementById('make').onclick=async()=>{const name=document.getElementById('guest').value.trim();if(!name){alert('Vui lòng nhập tên khách mời.');return;}const url=new URL(document.getElementById('side').value,location.href);url.searchParams.set('to',name);try{await navigator.clipboard.writeText(url.href);document.getElementById('result').textContent='Đã sao chép link: '+url.href;}catch(e){document.getElementById('result').innerHTML='Sao chép link này: <a href="'+url.href+'">'+url.href+'</a>';}};</script></body></html>
